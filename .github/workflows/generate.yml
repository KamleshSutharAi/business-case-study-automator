name: Generate Business Documentary

on:
  workflow_dispatch:
    inputs:
      competitor_url:
        description: 'Competitor YouTube URL to Analyze'
        required: true
        default: 'https://www.youtube.com/watch?v=dQw4w9WgXcQ'
      topic:
        description: 'Your New Topic'
        required: true
        default: 'The Collapse of Toys R Us'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install Python Dependencies
        run: pip install google-genai requests edge-tts youtube-transcript-api

      - name: Run Video Generator
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          COMPETITOR_URL: ${{ github.event.inputs.competitor_url }}
          TOPIC: ${{ github.event.inputs.topic }}
        run: python generate_video.py

      - name: Upload Finished Video as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: finished-documentary
          path: final_documentary.mp4
